apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonAnnotations:
  version: "v0.0.1"

resources:
  - db-template.yml

secretGenerator:
  - name: trex-db
    literals:
      - db.host="trex-db"
      - db.name="trex-db"
      - db.password="foobar"
      - db.user="trex-db"
      - db.port="5432"
